<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Tata ❤️</title>

    <!-- FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="assets/css/base/reset.css">

    <link rel="stylesheet" href="assets/css/base/variables.css">

    <link rel="stylesheet" href="assets/css/components/background.css">

    <link rel="stylesheet" href="assets/css/pages/birthday.css">

</head>

<body>

<!-- ========================= -->
<!-- BACKGROUND -->
<!-- ========================= -->

<div class="background">

    <div id="stars-container"></div>

    <div class="glow glow-left"></div>

    <div class="glow glow-right"></div>

</div>

<!-- ========================= -->
<!-- MUSIC -->
<!-- ========================= -->

<audio
    id="birthday-music"
    src="assets/audio/birthday.mpeg">

</audio>

<!-- ========================= -->
<!-- SECTION BIRTHDAY MESSAGE -->
<!-- ========================= -->

<section
    id="birthday-section"
    class="birthday-section">

    <div class="birthday-container">

        <!-- ====================== -->
        <!-- TITLE -->
        <!-- ====================== -->

        <h1 class="birthday-title">

            🎂 Selamat Ulang Tahun Tata

        </h1>

        <!-- ====================== -->
        <!-- PHOTO STACK -->
        <!-- ====================== -->

        <div class="photo-stack">

            <!-- LEFT -->

            <div class="photo-card left-card">

                <div class="photo-float">

                    <img
                        src="assets/images/photo1.jpeg"
                        alt="Photo 1">

                </div>

            </div>

            <!-- CENTER -->

            <div class="photo-card center-card">

                <div class="photo-float">

                    <img
                        src="assets/images/photo2.jpeg"
                        alt="Photo 2">

                </div>

            </div>

            <!-- RIGHT -->

            <div class="photo-card right-card">

                <div class="photo-float">

                    <img
                        src="assets/images/photo3.jpeg"
                        alt="Photo 3">

                </div>

            </div>

        </div>

        <!-- ====================== -->
        <!-- MESSAGE -->
        <!-- ====================== -->

        <div class="message-box">

            <p id="typing-text"></p>

        </div>

        <!-- ====================== -->
        <!-- NEXT -->
        <!-- ====================== -->

        <button
            id="next-prayer"
            class="next-btn">

            Next ❤️

        </button>

    </div>

</section>

<!-- ========================= -->
<!-- SECTION PRAYER -->
<!-- ========================= -->

<section id="prayer-section" class="prayer-section">

    <div class="prayer-container">

        <h1 class="prayer-title">
            🤲 Ada sedikit doa untuk Tata
        </h1>

        <p class="prayer-subtitle">
            Klik origami di bawah ya ❤️
        </p>

        <div class="origami-wrapper">

            <!-- Plane -->

            <div
                id="plane"
                class="origami paper-plane"
                data-popup="1">

                <div class="origami-float">

                    <img
                        src="assets/images/paper-plane.png"
                        alt="Paper Plane">

                </div>

            </div>

            <!-- Crane -->

            <div
                id="crane"
                class="origami paper-crane"
                data-popup="2">

                <div class="origami-float">

                    <img
                        src="assets/images/paper-crane.png"
                        alt="Paper Crane">

                </div>

            </div>

        </div>

        <button
            id="next-ending"
            class="next-btn">

            Next ❤️

        </button>

    </div>

    <!-- Popup -->

    <div
        id="popup-overlay"
        class="popup-overlay">

        <div class="popup">

            <h2 id="popup-title"></h2>

            <p id="popup-text"></p>

            <button
                id="close-popup"
                class="close-popup">

                Close

            </button>

        </div>

    </div>

</section>

<!-- ========================= -->
<!-- SECTION ENDING -->
<!-- ========================= -->

<section
    id="ending-section"
    class="ending-section">

    <div class="ending-container">

        <!-- ====================== -->
        <!-- PHOTO -->
        <!-- ====================== -->

        <div class="ending-photo">

            <img
                src="assets/images/ending-photo.png"
                alt="Foto Chubby">

        </div>

        <!-- ====================== -->
        <!-- TITLE -->
        <!-- ====================== -->

        <h1 class="ending-title">

            ❤️ Terima Kasih Tata

        </h1>

        <!-- ====================== -->
        <!-- MESSAGE -->
        <!-- ====================== -->

        <div class="ending-message">

            <p id="ending-typing"></p>

        </div>

        <!-- ====================== -->
        <!-- REPLAY MUSIC -->
        <!-- ====================== -->

        <button
            id="replay-music"
            class="replay-btn">

            🔄 Putar Musik Lagi

        </button>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<script src="assets/js/pages/background.js"></script>

<script src="assets/js/pages/birthday.js"></script>

</body>

</html>
