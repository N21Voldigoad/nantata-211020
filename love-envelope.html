<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Love Envelope</title>

    <!-- FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="assets/css/base/reset.css">

    <link rel="stylesheet" href="assets/css/base/variables.css">

    <link rel="stylesheet" href="assets/css/components/background.css">

    <link rel="stylesheet" href="assets/css/pages/love-envelope.css">

</head>

<body>

<div class="background">

    <div id="stars-container"></div>

    <div class="glow glow-left"></div>

    <div class="glow glow-right"></div>

</div>

<section class="envelope-page">

<div class="envelope-wrapper">

    <!-- ===================== -->
    <!-- LETTER -->
    <!-- ===================== -->

    <div
        id="letter"
        class="letter">

        <h2>

            Selamat Ulang Tahun

        </h2>

        <h1>

            Tata ❤️

        </h1>

        <p>

            - Nanta -

        </p>

    </div>

    <!-- ===================== -->
    <!-- ENVELOPE -->
    <!-- ===================== -->

    <div
        id="envelope"
        class="envelope">

        <div class="envelope-back"></div>

        <div
            id="flap"
            class="flap">

        </div>

        <div class="front"></div>

    </div>

    <!-- ===================== -->
    <!-- BUTTON -->
    <!-- ===================== -->

    <button
        id="open-btn"
        class="open-btn">

        ❤️

        <span>

            Click Here

        </span>

    </button>

    <!-- ===================== -->
    <!-- DORAEMON -->
    <!-- ===================== -->

    <div
        id="doraemon"
        class="doraemon">

        <img
            src="assets/images/doraemon.png"
            alt="Doraemon">

    </div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<script src="assets/js/pages/background.js"></script>

<script src="assets/js/pages/love-envelope.js"></script>

</body>

</html>
