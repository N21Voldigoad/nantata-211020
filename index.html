<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/base/reset.css">
    <link rel="stylesheet" href="assets/css/base/variables.css">

    <link rel="stylesheet" href="assets/css/components/background.css">
    <link rel="stylesheet" href="assets/css/components/loading.css">
    <link rel="stylesheet" href="assets/css/components/verification.css">

    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<!-- ========================= -->
<!-- BACKGROUND -->
<!-- ========================= -->

<div class="background">

    <div id="stars-container"></div>

    <div class="glow glow-left"></div>

    <div class="glow glow-right"></div>

</div>

<!-- ========================= -->
<!-- LOADING -->
<!-- ========================= -->

<section
id="loading-screen"
class="screen active">

<div class="glass-card">

<h1>

Mempersiapkan
<br>
Hadiah Spesial

</h1>

<p
id="loading-subtitle">

Sedang menyiapkan hadiah...

</p>

<div class="character-area">

    <img
        src="assets/images/girl.png"
        class="girl"
        alt="Girl">

        <div
        id="capybara"
        class="capybara-wrapper">

          <img
          src="assets/images/capybara.png"
          class="capybara"
          alt="Capybara">

        </div>

</div>

<div class="progress-wrapper">

    <div class="progress-track">

        <div
            id="progress-bar"
            class="progress-bar">

        </div>

    </div>

</div>

<div
    id="progress-text">

    0%

</div>

<p
    id="birthday-text"
    class="birthday-text">

    Selamat ulang tahun ✨

</p>

</div>

</section>

<!-- ========================= -->
<!-- VERIFICATION -->
<!-- ========================= -->

<section
id="verification-screen"
class="screen">

<div class="glass-card verification-card">

<h2>

Jawab yang bener dulu
<br>
baru boleh lihat hadiahnya 🤍

</h2>

<p>

Ini dibuat spesial
untuk wanita kesayanganku ❤️

</p>

<form id="verify-form">

<div class="input-group">

<label>

Tanggal Lahir

</label>

<input
id="birthday"
type="date">

</div>

<div class="input-group">

<label>

Nama Panggilan

</label>

<input
id="nickname"
type="text"
placeholder="Masukkan nama panggilan">

</div>

<button
type="submit">

Continue ❤️

</button>

</form>

</div>

</section>

<!-- ========================= -->
<!-- LIBRARY -->
<!-- ========================= -->

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<!-- ========================= -->
<!-- JS -->
<!-- ========================= -->

<script src="assets/js/core/app.js"></script>

<script src="assets/js/core/transition.js"></script>

<script src="assets/js/pages/background.js"></script>

<script src="assets/js/pages/loading.js"></script>

<script src="assets/js/pages/verification.js"></script>

</body>
</html>
